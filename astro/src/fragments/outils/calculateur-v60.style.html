<style>

  --stone-300: #d6d3d1; --stone-400: #a8a29e; --stone-500: #78716c;
  --stone-900: #1c1917; --amber-800: #92400e; --amber-700: #b45309;
}
body { font-family: 'Inter', sans-serif; background-color: var(--stone-50); color: var(--stone-900); letter-spacing: -0.02em; }
.serif { font-family: 'Instrument Serif', serif; }

.glass-nav { background: rgba(250,250,249,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
#scroll-progress { position:fixed; top:0; left:0; z-index:9998; height:2px; background:#92400e; width:0%; }
#mobile-menu { display: none; }
#mobile-menu.open { display: flex; }
@keyframes menuDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
.mobile-menu-panel { animation: menuDown 0.25s cubic-bezier(0.16,1,0.3,1) forwards; }
.drop-cap::first-letter {
  font-family: 'Instrument Serif', serif; font-size: 4.5rem; line-height: 0.75;
  float: left; margin-right: 0.12em; margin-top: 0.08em; color: var(--stone-900);
}
.prose-article { font-size: 1.0625rem; line-height: 1.8; color: #292524; font-weight: 300; }
.prose-article p { margin-bottom: 1.75rem; }
.prose-article h2 {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 2rem; line-height: 1.2; color: var(--stone-900);
  margin-top: 3rem; margin-bottom: 1.25rem; letter-spacing: -0.03em;
}
.prose-article h3 {
  font-family: 'Inter', sans-serif; font-weight: 600;
  font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--amber-800); margin-top: 2.25rem; margin-bottom: 0.875rem;
}
.prose-article strong { font-weight: 600; color: var(--stone-900); }
.pull-quote {
  border-left: 2px solid var(--amber-800); padding-left: 1.5rem;
  margin: 2.5rem 0; font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 1.35rem; line-height: 1.5; color: var(--stone-900); letter-spacing: -0.02em;
}
.info-box {
  background: white; border: 1px solid var(--stone-200);
  border-radius: 1.25rem; padding: 1.5rem 1.75rem; margin: 2rem 0;
}
.info-box .box-label {
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--amber-800); margin-bottom: 0.75rem;
}
.recipe-step {
  display: flex; gap: 1rem; margin-bottom: 1rem; align-items: flex-start;
}
.recipe-step .step-num {
  flex-shrink: 0; width: 1.75rem; height: 1.75rem; background: var(--stone-900);
  color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 600; margin-top: 0.1rem;
}

/* --- calculateur --- */
/* sr-only n'est pas dans le build Tailwind purge : on le redefinit ici */
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.calc { background:#fff; border:1px solid var(--stone-200); border-radius:1.5rem; padding:1.5rem; }
.calc-onglets { display:flex; gap:.25rem; background:var(--stone-100); padding:.25rem; border-radius:.85rem; margin-bottom:1.5rem; }
.calc-onglets button { flex:1; border:0; background:transparent; padding:.6rem .5rem; border-radius:.65rem;
  font:600 .8rem/1.2 'Inter',sans-serif; color:var(--stone-500); cursor:pointer; transition:all .15s; }
.calc-onglets button[aria-selected="true"] { background:#fff; color:var(--stone-900); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.calc-champ { margin-bottom:1.25rem; }
.calc-champ > label { display:block; font:600 .68rem/1 'Inter',sans-serif; text-transform:uppercase;
  letter-spacing:.14em; color:var(--stone-500); margin-bottom:.55rem; }
.calc-saisie { display:flex; align-items:center; gap:.5rem; }
.calc-saisie input[type=number] { width:100%; border:1px solid var(--stone-200); border-radius:.75rem;
  padding:.7rem .9rem; font:600 1.35rem/1 'Inter',sans-serif; color:var(--stone-900); background:var(--stone-50);
  -moz-appearance:textfield; }
.calc-saisie input::-webkit-outer-spin-button,.calc-saisie input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.calc-saisie input:focus { outline:2px solid var(--amber-700); outline-offset:1px; }
.calc-unite { font:500 .9rem/1 'Inter',sans-serif; color:var(--stone-400); }
.calc-segments { display:flex; gap:.4rem; flex-wrap:wrap; }
.calc-segments button { flex:1; min-width:5.5rem; border:1px solid var(--stone-200); background:#fff;
  border-radius:.75rem; padding:.6rem .4rem; cursor:pointer; transition:all .15s;
  font:600 .85rem/1.35 'Inter',sans-serif; color:var(--stone-900); }
.calc-segments button small { display:block; font-weight:400; font-size:.68rem; color:var(--stone-400); margin-top:.15rem; }
.calc-segments button[aria-pressed="true"] { border-color:var(--stone-900); background:var(--stone-900); color:#fafaf9; }
.calc-segments button[aria-pressed="true"] small { color:var(--stone-400); }
.calc-etapes { list-style:none; padding:0; margin:0; border-top:1px solid var(--stone-100); }
.calc-etapes li { display:flex; align-items:baseline; gap:.9rem; padding:.85rem .25rem;
  border-bottom:1px solid var(--stone-100); }
.calc-t { font-variant-numeric:tabular-nums; font:600 .8rem/1.4 'Inter',sans-serif; color:var(--amber-800);
  min-width:3.1rem; }
.calc-txt { flex:1; font:300 .95rem/1.5 'Inter',sans-serif; color:#292524; }
.calc-txt b { font-weight:600; color:var(--stone-900); }
.calc-cumul { font-variant-numeric:tabular-nums; font:600 .95rem/1.4 'Inter',sans-serif;
  color:var(--stone-900); white-space:nowrap; }
.calc-resume { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin:1.5rem 0 .25rem; }
.calc-resume div { background:var(--stone-50); border-radius:.85rem; padding:.8rem .6rem; text-align:center; }
.calc-resume dt { font:600 .6rem/1 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.12em;
  color:var(--stone-400); margin-bottom:.35rem; }
.calc-resume dd { margin:0; font:600 1.05rem/1.2 'Inter',sans-serif; color:var(--stone-900);
  font-variant-numeric:tabular-nums; }
.calc-note { font:300 .82rem/1.6 'Inter',sans-serif; color:var(--stone-500); margin-top:1.1rem; }
@media (max-width:400px){ .calc-resume { grid-template-columns:1fr 1fr; } }
</style>
