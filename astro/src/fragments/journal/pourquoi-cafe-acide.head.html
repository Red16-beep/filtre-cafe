            "text": "Un bon grain ne garantit pas une bonne tasse. Si votre café est acide malgré un grain de qualité, c'est presque toujours une sous-extraction : mouture trop grossière, eau trop froide, ou temps d'infusion trop court. Ces trois paramètres agissent ensemble, commencez par affiner la mouture d'un cran et observez. Voir aussi notre guide sur le café amer pour comprendre les deux côtés du spectre."

            "text": "Plusieurs signes caractéristiques : acidité pointue et déséquilibrée, manque de corps et de texture en bouche, fin de tasse courte et creuse, couleur claire dans la tasse, absence de douceur perceptible. L'acidité d'un café sous-extrait est solitaire, elle n'est pas soutenue par le reste du profil aromatique. Correction : affinez la mouture, montez la température, allongez l'infusion. Un seul changement à la fois."
          }
