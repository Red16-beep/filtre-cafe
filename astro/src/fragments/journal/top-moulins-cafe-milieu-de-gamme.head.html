          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les meules plates donnent une distribution de particules plus resserrée, donc une tasse plus nette et plus définie, avec un peu moins de corps. Les coniques donnent plus de rondeur et de texture. Ce n'est pas une hiérarchie mais un profil : les plates flattent les torréfactions claires et le filtre de dégustation, les coniques les torréfactions médium et l'espresso classique."

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le single dose consiste à ne verser dans le moulin que la dose du moment, au lieu de remplir une trémie. Cela évite qu'un stock de grains s'évente et permet de changer de café d'une tasse à l'autre. C'est utile si vous avez plusieurs sachets ouverts en même temps. Sinon, une trémie classique est plus rapide au quotidien, puisqu'il n'y a rien à peser avant de moudre."
          }

          }
