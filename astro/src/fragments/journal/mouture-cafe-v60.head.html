        "@type": "Answer",
        "text": "Ce n'est pas forcément un défaut d'extraction. Certains cafés, éthiopiens lavés, kenyans, certains colombiens, ont une acidité naturelle vive et fruitée qui est une qualité, pas un défaut. La question est : est-ce que cette acidité est agréable (fruitée, lumineuse) ou déplaisante (tranchante, âpre, saline) ? Si elle est agréable, c'est le profil du café. Si elle est déplaisante, essayez de monter légèrement la température (94–95°C) plutôt que de serrer la mouture, la chaleur adoucit l'acidité sans sur-extraire."

        "@type": "Answer",
        "text": "Idéalement oui, surtout si vous changez d'origine ou de torréfacteur. En pratique, si vous restez dans le même style (médium, arabica lavé), le réglage variera peu. Ce qui change le plus : passer d'un naturel brésilien (densité faible, extrait facilement) à un éthiopien lavé clair (densité haute, extrait difficilement). Comptez 1 à 3 crans d'écart entre ces profils extrêmes. Si vous restez chez le même torréfacteur avec les mêmes origines, un micro-ajustement d'½ cran suffit généralement."
