name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA de commit (tag indiqué en commentaire), mise à jour manuelle.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install
        working-directory: astro
        run: npm ci

      - name: Sync static assets into public/
        run: bash astro/sync-public.sh

      - name: Build
        working-directory: astro
        run: npm run build

      - name: Lint built site (links, titles, anti-IA)
        working-directory: astro
        run: python3 lint.py dist

      - name: Sitemap à jour (lastmod alignés sur les dateModified)
        run: python3 tools/sitemap.py --check
